<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMUCON 2026 · IT Club · Come play.</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="poster" aria-label="EMUCON 2026. IT Club. Come play. Pick a game. Make your move. 24 October 2026, EMU Stadium.">
    <div id="background" class="night-field" aria-hidden="true"></div>
    <div id="stars" aria-hidden="true">
      <img class="star s1" src="art/star-1.svg" alt="">
      <img class="star s2" src="art/star-2.svg" alt="">
      <img class="star s3" src="art/star-3.svg" alt="">
      <img class="star s4" src="art/star-1.svg" alt="">
      <img class="star s5" src="art/star-2.svg" alt="">
      <img class="star s6" src="art/star-3.svg" alt="">
      <i class="pin p1"></i><i class="pin p2"></i><i class="pin p3"></i>
      <i class="pin p4"></i><i class="pin p5"></i><i class="pin p6"></i>
      <i class="pin p7"></i><i class="pin p8"></i><i class="pin p9"></i>
    </div>
    <div id="festival-identity" class="festival-identity">
      <div class="festival-name">EMUCON</div>
      <div class="year">2026</div>
    </div>
    <section id="institutional-lockup" class="institutional-note" aria-label="Eastern Mediterranean University and Student Development, Events and Sports Affairs Directorate">
      <img class="note-paper" src="art/paper-slip.png" alt="">
      <div class="institutional-marks">
        <img class="emu-mark" src="assets/EMU-logo-primary-EN.svg" alt="Eastern Mediterranean University">
        <img class="directorate-mark" src="assets/ogesim-en-navy.png" alt="Student Development, Events and Sports Affairs Directorate">
      </div>
    </section>
    <div id="stamp" class="club-stamp">IT CLUB</div>
    <h1 id="headline" class="headline"><span id="headline-come">COME</span><span id="headline-play">PLAY.</span></h1>
    <div id="whale" class="whale"><img src="art/whale.svg" alt=""></div>
    <p id="invitation" class="invitation">Pick a game.<br>Make your move.</p>
    <div id="paper" class="date-note">
      <img class="date-paper" src="art/amber-slip.png" alt="">
      <div class="date-copy">
        <p class="date">24 OCTOBER <span>2026</span></p>
        <p class="venue">EMU STADIUM</p>
      </div>
    </div>
    <div id="planet" class="planet"><img src="art/planet-2.svg" alt=""></div>
    <div id="rocket" class="rocket">
      <img id="rocket-body" src="art/rocket-body-layer.svg" alt="">
      <img id="rocket-flame" src="art/rocket-flame-layer.svg" alt="">
    </div>
    <div id="print-grain" class="print-grain" aria-hidden="true"></div>
  </main>
</body>
</html>
